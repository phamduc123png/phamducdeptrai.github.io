<!DOCTYPE html>
<html>
<head>
  <title>Trang Web của Tôi</title>
  <style>
    body {
      background: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #e74c3c;
    }
    button {
      background: #4f4f55;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
    img {
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      margin: 20px 0;
    }
    input[type="text"] {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 200px;
    }
    .card {
      display: inline-block;
      background: rgb(253, 249, 249);
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin: 20px auto;
      max-width: 200px;
      text-align: between;
    }
    .card:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .card-img {
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      width: 100%;
    }
    .card-content {
      padding: 15px;
    }
    .card-link {
      text-decoration: none;
    }
    .video-top-right {
      position: absolute;
      top: 10px;
      right: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
