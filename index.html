<!DOCTYPE html>
<html>
<head>
  <title>Trang Web của Tôi</title>
  <style>
    body {
      background: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #e74c3c;
    }
    button {
      background: #4f4f55;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
    img {
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      margin: 20px 0;
    }
    input[type="text"] {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 200px;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin: 20px auto;
      max-width: 300px;
      text-align: left;
    }
    .card-img {
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      width: 100%;
    }
    .card-content {
      padding: 15px;
    }
    .card-link {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Chào mừng đến với website!</h1>
  <p>Đây là trang đầu tiên của tôi trên GitHub Pages.</p>
  <p>hello mọi người</p>
  <p>hahahahahaha</p>
  <input type="text" placeholder="Nhập nội dung ở đây">
  <a href="https://chatgpt.com/">
    <button>chatgpt</button>
  </a>
  <h2>hohohoho</h2>
  <video width="320" height="240" autoplay loop muted>
    <source src="ten-video.mp4.mp4" type="video/mp4">
  </video>
  <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&t=3s" class="card-link">
    <div class="card">
      <img src="ten-anh.jpg.png" alt="Mô tả ảnh" class="card-img">
      <div class="card-content">
        <h3>blah blah</h3>
        <p>bất ngờ</p>
      </div>
    </div>
  </a>
</body>
</html>
